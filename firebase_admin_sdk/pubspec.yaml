name: tekartik_firebase_admin_sdk
description: Tekartik Firebase implementation on top of firebase_admin_sdk
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  path: ">=1.9.1"
  google_cloud_storage: ">=0.6.3"
  google_cloud_protobuf: ">=0.5.1"
  tekartik_common_utils:
    git: https://github.com/tekartik/common_utils.dart
  # Temp (2028-08-05)
  firebase_admin_sdk: ">=0.5.3 <0.6.0"
  tekartik_firebase:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase
  tekartik_firebase_firestore:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore
  google_cloud_firestore: ">=0.5.1"
  tekartik_firebase_storage:
    git:
      url: https://github.com/tekartik/firebase_storage.dart
      path: storage
  tekartik_firebase_auth:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth
dev_dependencies:
  lints: ">=6.1.0"
  test: ">=1.31.1"
resolution: workspace
